# ===== project metadata =====

[project]
name = "parent-lookup"
version = "0.2.4"
description = "Python package enabling a child object to dynamically lookup its parent at runtime."
requires-python = ">=3.12"
readme = "README.md"
license-files = [ "LICENSE" ]
authors = [
    { name = "Claas Rostock", email = "claas.rostock@dnv.com" },
]
maintainers = [
    { name = "Claas Rostock", email = "claas.rostock@dnv.com" },
]
keywords = [
    "parent",
    "child",
    "lookup",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typing-inspect>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/ClaasRostock/parent-lookup"
Documentation = "https://ClaasRostock.github.io/parent-lookup"
Repository = "https://github.com/ClaasRostock/parent-lookup.git"
Issues = "https://github.com/ClaasRostock/parent-lookup/issues"
Changelog = "https://github.com/ClaasRostock/parent-lookup/blob/main/CHANGELOG.md"


# ===== dependency groups (PEP 735) =====

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-dependency>=0.6.0",
    "pytest-timeout>=2.3.1",
]
docs = [
    "Sphinx>=9.1",
    "sphinx-argparse-cli>=1.24.0",
    "sphinx-autodoc-typehints>=3.13",
    "sphinxcontrib-mermaid>=2.1",
    "myst-parser>=5.1",
    "furo>=2025.12",
]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "ruff>=0.17.0",
    "pyright>=1.1.414",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "jupyter>=1.1.1",
]


# ===== `uv` settings =====

[tool.uv]
default-groups = [
    "dev",
]
system-certs = true
required-environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]


# ===== build system settings =====

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/parent_lookup",
    "tests",
    ".coveragerc",
    ".editorconfig",
    ".pre-commit-config.yaml",
    "pyproject.toml",
    "pytest.ini",
    "ruff.toml",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/parent_lookup",
]

[tool.hatch.metadata]
allow-direct-references = true


# ===== `mypy` settings =====

[tool.mypy]
plugins = []
mypy_path = "stubs"
files = [
    "src",
    "tests",
    # "examples",
]
exclude = [
    "src/folder_to_be_excluded",
]
check_untyped_defs = true
disable_error_code = [
    "misc",
    "import-untyped",
]


# ===== `pyright` settings =====

[tool.pyright]
stubPath = "stubs"
include = [
    "src",
    "tests",
    # "examples",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "src/folder_to_be_excluded",
]

typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingParameterType = "error"
reportUnknownParameterType = "warning"
reportUnknownMemberType = "warning"                # consider to set to `false` if you work a lot with matplotlib and pandas, which are both not properly typed and known to trigger this warning
reportMissingTypeArgument = "error"
reportPropertyTypeMismatch = "error"
reportFunctionMemberAccess = "warning"
reportPrivateUsage = "warning"
reportTypeCommentUsage = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "error"
reportInconsistentConstructor = "error"
reportOverlappingOverload = "warning"
reportUninitializedInstanceVariable = "warning"
reportCallInDefaultInitializer = "warning"
reportUnnecessaryIsInstance = "information"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportUnusedCallResult = "warning"
reportUnusedExpression = "warning"
reportMatchNotExhaustive = "warning"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"
reportUntypedBaseClass = "error"
reportUntypedNamedTuple = "warning"
reportUnnecessaryTypeIgnoreComment = "information"
# Activate the following rules only locally and temporary, i.e. for a QA session.
# (For server side CI they are considered too strict.)
# reportMissingTypeStubs = true
# reportConstantRedefinition = "warning"
# reportImportCycles = "warning"
# reportImplicitStringConcatenation = "warning"
